<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A calm, beautiful mushaf that adapts to how you read — Quran reading, recitation practice, hifz, and tafsir." />

    <!-- PWA installability -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Matches the app's actual background (see palettes.ts LIGHT/DARK), not
         the brand teal — iOS paints the standalone-app status bar with this,
         so a mismatched value shows as a separate-colored band up top. The
         light value here is only the pre-hydration guess for the common
         default (system=light); ThemeProvider updates `content` in JS once
         the real theme (which may override the OS scheme) is known. -->
    <meta name="theme-color" content="#FBF7F0" />

    <!-- iOS "Add to Home Screen" — Safari ignores most of the manifest and
         needs its own meta tags + a dedicated touch icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AyahOne" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Pins html/body to all four viewport edges rather than giving them
         any computed `height` at all. On iOS standalone (home-screen) PWAs,
         `window.innerHeight`/`100dvh` both measure the height of the "safe"
         content area *below the status bar* (e.g. 894px on a 956px-tall
         screen — exactly the 62px status-bar height short). `viewport-fit=
         cover` above extends the actual viewport `position: fixed` anchors
         against to the FULL physical screen, including under the status bar
         — so giving this box an explicit height of 894px while its `top`
         pins to row 0 of that full viewport leaves exactly the bottom 62px
         uncovered (a solid bar in whichever theme's fallback colour, below
         — this combination was tried and produces exactly that gap; do not
         reintroduce it). Leaving `height` unset and letting `top`/`bottom`
         both pin to 0 is the one approach that isn't shorter than the true
         screen on either edge, on any relaunch, without any JS at all. */
      html,
      body {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        width: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* iOS Safari's rubber-band/bounce overscroll effect reveals the
         browser's own default white background at the page edges — a
         separate mechanism from anything above, and one that isn't
         controlled by html/body's `background-color` at all. `overflow:
         hidden` alone doesn't reliably suppress it in standalone PWA mode
         on every iOS version; `overscroll-behavior: none` is the property
         specifically meant to disable the bounce/reveal itself. */
      html,
      body {
        overscroll-behavior: none;
      }
      /* These styles make the root element full-height. Deliberately `100%`
         (of body's now-correctly-full-bleed height) and NOT `100dvh` — dvh
         is a viewport-relative unit even on a normal-flow element like this
         one, so it would independently reintroduce the exact status-bar
         shortfall explained above, this time between #root and body instead
         of between body and the screen. */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Backstop for that same gap: if anything still falls short by a pixel
         or two, it should read as the app's own background, not a jarring
         white flash, on either theme. */
      html,
      body {
        background-color: #fbf7f0;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0b1115;
        }
      }
      /* react-native-web's <TextInput> renders to a real DOM <input>/
         <textarea> — something native iOS/Android has no equivalent of at
         all, so this can only ever be a web concern — which the browser
         gives its own default blue focus ring. The app already shows its
         own focus/active cues per-field (border-colour changes driven by
         component state), so that ring is redundant and clashes with the
         theme. Removed unconditionally on touch devices to match native
         exactly (mobile Safari/Chrome's :focus-visible heuristics are
         looser than desktop and can mark a plain tap as "visible", which is
         what was showing the ring on the installed PWA); kept — in the
         app's own brass accent, not blue — for :focus-visible on devices
         with a precise pointer (mouse/trackpad), where it's reliably
         keyboard/programmatic-only and still useful for accessibility. */
      input,
      textarea,
      select {
        outline: none;
        box-shadow: none;
      }
      @media (pointer: fine) {
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
          outline: 2px solid rgba(176, 134, 65, 0.55);
          outline-offset: 1px;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- Registers the service worker (public/sw.js) so the app shell can be
         installed and re-launched offline. Errors are swallowed — an
         unsupported browser, or a plain `expo start --web` dev server
         without HTTPS, just doesn't get the offline/installable behaviour. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
