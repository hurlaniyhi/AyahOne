<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="A calm, beautiful mushaf that adapts to how you read — Quran reading, recitation practice, hifz, and tafsir." />

    <!-- PWA installability -->
    <link rel="manifest" href="/manifest.json" />
    <!-- Matches the app's actual background (see palettes.ts LIGHT/DARK), not
         the brand teal — iOS paints the standalone-app status bar with this,
         so a mismatched value shows as a separate-colored band up top. The
         light value here is only the pre-hydration guess for the common
         default (system=light); ThemeProvider updates `content` in JS once
         the real theme (which may override the OS scheme) is known. -->
    <meta name="theme-color" content="#FBF7F0" />

    <!-- iOS "Add to Home Screen" — Safari ignores most of the manifest and
         needs its own meta tags + a dedicated touch icon. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AyahOne" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Mobile browsers resize their address/toolbar without updating `vh`,
         so a plain `height: 100%` (resolved against `100vh`) falls short of
         the REAL visible viewport on phones — showing as a blank strip of
         the browser's own white background below the app. `100dvh` tracks
         the actual visible area on most engines, so it's the fallback here
         for browsers that support it but don't run the script below (or
         before that script's first paint); `100%`/`100vh` above remain the
         fallback for the rare engine that understands neither. */
      @supports (height: 100dvh) {
        html,
        body {
          height: 100dvh;
        }
        #root {
          height: 100dvh;
        }
      }
      /* Precise fix for the same gap on iOS standalone (home-screen) PWAs:
         `100dvh` is a *CSS* unit and on iOS's standalone display-mode it is
         sometimes computed once against a stale layout-viewport reading
         after a full close+reopen (not just backgrounding), rather than the
         real visible area — leaving a growing white strip at the bottom
         that a pure-CSS rule can't self-correct without a reflow. The
         script below measures the actual viewport in JS on load and on
         every event that can change it, and writes the exact pixel value
         here — overriding the `dvh` rule above whenever it's present and
         correct.  */
      html.js-app-height,
      html.js-app-height body,
      html.js-app-height #root {
        height: var(--app-height);
      }
      /* Backstop for that same gap: if anything still falls short by a pixel
         or two, it should read as the app's own background, not a jarring
         white flash, on either theme. */
      html,
      body {
        background-color: #fbf7f0;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #0b1115;
        }
      }
      /* react-native-web's <TextInput> renders to a real DOM <input>/
         <textarea> — something native iOS/Android has no equivalent of at
         all, so this can only ever be a web concern — which the browser
         gives its own default blue focus ring. The app already shows its
         own focus/active cues per-field (border-colour changes driven by
         component state), so that ring is redundant and clashes with the
         theme. Removed unconditionally on touch devices to match native
         exactly (mobile Safari/Chrome's :focus-visible heuristics are
         looser than desktop and can mark a plain tap as "visible", which is
         what was showing the ring on the installed PWA); kept — in the
         app's own brass accent, not blue — for :focus-visible on devices
         with a precise pointer (mouse/trackpad), where it's reliably
         keyboard/programmatic-only and still useful for accessibility. */
      input,
      textarea,
      select {
        outline: none;
        box-shadow: none;
      }
      @media (pointer: fine) {
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
          outline: 2px solid rgba(176, 134, 65, 0.55);
          outline-offset: 1px;
        }
      }
    </style>
    <!-- Companion to the `--app-height` rule above: measures the real
         viewport in JS and keeps it current. Runs before the app mounts so
         there's no flash, and re-runs on `pageshow` — the event that fires
         when a standalone PWA is reopened from the home screen after being
         fully closed, which is exactly when the plain CSS `dvh` unit above
         has been seen to compute against a stale viewport reading. -->
    <script>
      (function () {
        function setAppHeight() {
          var h = window.innerHeight;
          if (!h) return;
          document.documentElement.style.setProperty('--app-height', h + 'px');
          document.documentElement.classList.add('js-app-height');
        }
        setAppHeight();
        window.addEventListener('resize', setAppHeight);
        window.addEventListener('orientationchange', setAppHeight);
        window.addEventListener('pageshow', setAppHeight);
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <!-- Registers the service worker (public/sw.js) so the app shell can be
         installed and re-launched offline. Errors are swallowed — an
         unsupported browser, or a plain `expo start --web` dev server
         without HTTPS, just doesn't get the offline/installable behaviour. -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
    </script>
  </body>
</html>
